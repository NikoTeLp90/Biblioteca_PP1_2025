<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear insumo</title>
</head>

<body>
    <h1>Crear insumo</h1>

    <form action="../php/crearInsumos.php" method="post">

        <label for="codigo">Codigo:</label>
        <input type="text" name="codigo" placeholder="Ingrese el codigo" required>
        <br>

        <label for="nombre">Nombre:</label>
        <input type="text" name="nombre" placeholder="Ingrese el nombre" required>
        <br>

        <label for="Categoria">Categoria:</label>
        <input type="text" name="categoria" placeholder="Ingrese la categoria" required>
        <br>

        <label for="estado">Estado:</label>
        <select name="estado">
            <option value="disponible">Disponibre</option>
            <option value="enReparacion">En Reparacion</option>
            <option value="baja">Baja</option>
        </select>

        <label for="observacion">Observacion:</label>
        <input type="text" name="observacion" required><br>

        
        <label for="disponibilidad">Disponibilidad:</label>
        <select name="disponibilidad">
            <option value="disponible">Disponibre</option>
            <option value="prestado">Prestado</option>
            <option value="baja">Baja</option>
        </select>

        <input type="submit" value="Guardar">
        <a href="../index.html">Volver al index</a>
        <button type="button" onclick="window.location.href='../index.html';">Ir al Index</button>
    </form>

</body>
</html>
